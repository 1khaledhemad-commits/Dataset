[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-foundation-data-platform"
version = "0.1.0"
description = "Auditable, bounded data acquisition and curation for AI-FOUNDATION"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
data-platform = "data_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
